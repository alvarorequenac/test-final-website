<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test Final de Rocas · Ígneas, Sedimentarias y Metamórficas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============ base ============ */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface2:#e5eae8; --surface3:#f4f7f6;
  --ink:#15201e; --muted:#54635e; --line:#cdd7d3;
  --accent:#1c6b5f; --accent-ink:#ffffff;
  --ig:#a8452f; --ig-soft:#f8e4de; --ig-line:#e5b8ab;
  --sed:#8a651a; --sed-soft:#f8eed6; --sed-line:#e3cf9f;
  --met:#1c6b5f; --met-soft:#dcefe9; --met-line:#a9d6c8;
  --ok:#1b7a43; --okbg:#dcf1e4;
  --bad:#b3261e; --badbg:#f8dddb;
  --warn:#8a5a00; --warnbg:#f9ecd0;
  --f-head:"Space Grotesk",system-ui,sans-serif;
  --f-body:"Inter",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#172120; --surface2:#1f2c2a; --surface3:#141c1b;
    --ink:#e6efec; --muted:#9bada7; --line:#2c3c39;
    --accent:#5cc4b0; --accent-ink:#06201b;
    --ig:#f0a08a; --ig-soft:#3a211b; --ig-line:#6d3a2d;
    --sed:#e2b252; --sed-soft:#362a12; --sed-line:#6b5321;
    --met:#5cc4b0; --met-soft:#17332c; --met-line:#2e6156;
    --ok:#72d498; --okbg:#173627;
    --bad:#ff9d93; --badbg:#3d201e;
    --warn:#e8b95c; --warnbg:#3a2d10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172120; --surface2:#1f2c2a; --surface3:#141c1b;
  --ink:#e6efec; --muted:#9bada7; --line:#2c3c39;
  --accent:#5cc4b0; --accent-ink:#06201b;
  --ig:#f0a08a; --ig-soft:#3a211b; --ig-line:#6d3a2d;
  --sed:#e2b252; --sed-soft:#362a12; --sed-line:#6b5321;
  --met:#5cc4b0; --met-soft:#17332c; --met-line:#2e6156;
  --ok:#72d498; --okbg:#173627;
  --bad:#ff9d93; --badbg:#3d201e;
  --warn:#e8b95c; --warnbg:#3a2d10;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 56px max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 0 12px}
.kicker{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
h1{font:700 clamp(26px,4vw,38px)/1.05 var(--f-head);letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;display:flex;gap:4px;overflow-x:auto;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:6px 0;margin-bottom:18px}
nav.tabs button{flex:none;background:transparent;border:0;color:var(--muted);font:600 14px var(--f-body);padding:9px 14px;border-radius:999px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main{min-height:55vh}
h2{font:700 clamp(21px,3vw,28px)/1.15 var(--f-head);letter-spacing:-.01em;margin:0 0 8px}
h3{font:700 16px/1.25 var(--f-head);margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.narrow{max-width:820px;margin:0 auto}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.soft{background:var(--surface3)}
.hero{background:linear-gradient(135deg,var(--surface) 0%,var(--surface3) 100%);border:1px solid var(--line);border-radius:16px;padding:22px}
.hero .kicker{color:var(--accent)}
.hero h2{max-width:760px}
.hero p{max-width:760px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:720px){.steps{grid-template-columns:1fr}}
.stepbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stepbox b{display:block;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.stepbox span{font-size:13px;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:10px 16px;font-weight:650;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;font:500 10.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.tag.ig{color:var(--ig);background:var(--ig-soft)}
.tag.sed{color:var(--sed);background:var(--sed-soft)}
.tag.met{color:var(--met);background:var(--met-soft)}
.tag.plain{color:var(--muted);background:var(--surface2)}
.notice{border-radius:9px;padding:10px 12px;font-size:13.5px;background:var(--warnbg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.notice.bad{background:var(--badbg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.notice.ok{background:var(--okbg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.notice.info{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.hook{background:var(--surface2);border-left:4px solid var(--accent);border-radius:7px;padding:9px 11px;font-size:13.5px}
.hook b{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
/* ============ test ============ */
.test-wrap{max-width:1120px;margin:0 auto}
.test-head{display:flex;flex-direction:column;gap:8px}
.test-line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.step-label{font:600 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.exam-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px;align-items:start}
@media (max-width:900px){.exam-grid{grid-template-columns:1fr}}
.photo-col{display:flex;flex-direction:column;gap:10px}
@media (min-width:901px){.photo-col{position:sticky;top:74px}}
.sample-photo{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sample-photo img{width:100%;max-height:64vh;object-fit:contain;display:block;background:var(--surface2);cursor:zoom-in}
.sample-photo figcaption{padding:8px 11px;font:400 11.5px var(--f-mono);color:var(--muted);border-top:1px solid var(--line)}
.photo-hint{font-size:12.5px;color:var(--muted);padding:0 2px}
.gate-panel{border-left:4px solid var(--accent)}
.panel-head{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
.panel-head .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--f-mono)}
.panel-head .num.two{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:5px}
.field .lb{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input[type=text],.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.field textarea{min-height:78px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 25%,transparent);outline-offset:0}
.field .hint{font-size:11.5px;color:var(--muted)}
.field.locked .locked-box{display:flex;gap:8px;align-items:flex-start;background:var(--okbg);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);border-radius:8px;padding:9px 11px;font-size:13.5px}
.field.locked .locked-box b{flex:none}
.verdict-list{display:flex;flex-direction:column;gap:7px}
.verdict{display:flex;gap:8px;align-items:flex-start;border-radius:8px;padding:9px 11px;font-size:13.5px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
.verdict.pend{background:var(--surface2);color:var(--muted)}
.verdict > b{flex:none;font-size:15px;line-height:1.2;margin-top:1px}
.verdict .body{min-width:0;color:var(--ink)}
.verdict .body .ans{display:block;color:var(--ink);margin-top:2px;font-size:12.5px}
.verdict .body .ans b{color:var(--muted);font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.verdict .body .mine{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.gate-msg{border-left:4px solid var(--bad);background:var(--badbg);color:var(--ink);padding:10px 12px;border-radius:7px;font-size:13.5px;margin-top:8px}
.gate-msg.pass{border-color:var(--ok);background:var(--okbg)}
.gate-msg b{color:var(--bad)}
.gate-msg.pass b{color:var(--ok)}
.diag-meter{display:flex;justify-content:space-between;gap:8px;font:500 11px var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.diag-meter .ok{color:var(--ok)}
.diag-meter .short{color:var(--bad)}
.warn-line{color:var(--bad);font-size:12px}
.table-form{display:flex;flex-direction:column;gap:11px}
.score-line{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:2px}
.score-line b{font-size:18px;font-family:var(--f-head)}
/* ============ spec / correct row ============ */
dl.spec{margin:0;display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 14px}
dl.spec dt{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
dl.spec dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){dl.spec{grid-template-columns:1fr;gap:2px}dl.spec dt{padding-top:8px}}
.diag-list{margin:0;padding-left:1.15rem}
.diag-list li{margin:2px 0}
/* ============ study ============ */
.study-head{display:flex;flex-direction:column;gap:11px;margin-bottom:15px}
.study-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.study-tools input[type=search]{flex:1 1 240px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.rock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.rock-card{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column;transition:transform .12s,border-color .12s}
.rock-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.rock-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface2)}
.rock-meta{padding:9px 10px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.rock-meta b{font-size:14px;line-height:1.2}
.rock-meta .tag{align-self:flex-start}
.count-line{font:500 11.5px var(--f-mono);letter-spacing:.05em;color:var(--muted)}
.empty{padding:26px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
/* ============ table ============ */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--surface);max-height:74vh}
table.big{border-collapse:separate;border-spacing:0;min-width:1180px;width:100%;font-size:12.5px}
table.big th{position:sticky;top:0;z-index:3;background:var(--surface2);font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:9px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.big td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.big tbody tr:hover td{background:var(--surface3)}
table.big th:first-child,table.big td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);min-width:178px;max-width:210px}
table.big th:first-child{background:var(--surface2);z-index:4}
table.big tbody tr:hover td:first-child{background:var(--surface3)}
.t-name{display:flex;gap:8px;align-items:flex-start}
.t-name img{width:54px;height:42px;object-fit:cover;border-radius:5px;flex:none;background:var(--surface2)}
.t-name b{display:block;font-size:13px;line-height:1.15}
.t-name span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.tbl-small{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl-small th,.tbl-small td{padding:7px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl-small th{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0;background:var(--surface2)}
.tbl-small tr:first-child th:first-child{border-top-left-radius:7px}
/* ============ guide ============ */
.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.guide-grid{grid-template-columns:1fr}}
.guide-table{width:100%;border-collapse:collapse;font-size:13px}
.guide-table th,.guide-table td{padding:7px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.guide-table th{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.guide-table td:first-child{font-weight:600;white-space:nowrap}
.figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.figure img{width:100%;display:block;background:#fff}
.figure figcaption{padding:8px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
details{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface)}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:10px}
/* ============ overlay ============ */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(5,12,10,.74);overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);max-width:930px;margin:0 auto;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.sheet-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6.5fr);gap:18px;padding:16px}
@media (max-width:760px){.sheet-body{grid-template-columns:1fr}}
.ficha-photo{display:flex;flex-direction:column;gap:8px;min-width:0}
.ficha-photo #ficha-main{width:100%;max-height:58vh;object-fit:contain;border-radius:9px;background:var(--surface2);display:block;cursor:zoom-in}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{padding:0;border:2px solid transparent;border-radius:6px;background:none;overflow:hidden}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{width:54px;height:42px;object-fit:cover;display:block}
.ficha-data{min-width:0}
.ficha-data h2{font-size:25px;margin-bottom:6px}
.ficha-data .tag{margin-bottom:10px}
.sheet-foot{display:flex;justify-content:space-between;gap:8px;padding:11px 14px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.zoom-wrap{max-width:1100px;margin:auto;position:relative}
.zoom-wrap img{width:100%;max-height:88vh;object-fit:contain;display:block;border-radius:10px;background:var(--surface2)}
.zoom-wrap .icon-btn{position:absolute;top:8px;right:8px;background:var(--surface)}
/* ============ mix picker ============ */
.mix-picker{display:flex;flex-direction:column;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px}
.mix-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.mix-row label{display:flex;flex-direction:column;gap:5px;font:500 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mix-row input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:650 17px var(--f-head);color:var(--ink)}
.mix-row input:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 25%,transparent);outline-offset:0}
.mix-total{font:500 12px var(--f-mono);color:var(--muted)}
.mix-total b{font-size:16px;color:var(--ok)}
.mix-total.bad b{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.foot{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.foot b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<div class="wrap">

</div>
<div id="ov" class="overlay" hidden></div>

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const norm = s => String(s ?? '').toLowerCase().normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '').replace(/ñ/g, 'n')
  .replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

function tokenMatch(hay, key) {
  hay = norm(hay); key = norm(key);
  if (!key) return false;
  if (key.includes(' ')) return hay.includes(key);
  // Las claves de 5+ letras son raíces (granoblast, lepidoblast, arcil, cuarz…):
  // se aceptan sus derivados (granoblástica, arcillosa, cuarzosa…).
  if (key.length >= 5) {
    const stem = new RegExp('(^|[^a-z0-9])' + escRe(key));
    return stem.test(hay);
  }
  const re = new RegExp('(^|[^a-z0-9])' + escRe(key) + '(s)?([^a-z0-9]|$)');
  return re.test(hay);
}
function hasAny(input, keys) { return (keys || []).some(k => tokenMatch(input, k)); }
function listOK(input, groups, frac) {
  if (!groups || !groups.length) return norm(input).length > 0;
  const hits = groups.filter(g => hasAny(input, g)).length;
  const need = Math.max(1, Math.ceil(groups.length * (frac ?? 0.5)));
  return hits >= need;
}
function splitDiag(s) {
  s = String(s || '').trim();
  if (!s) return [];
  let parts = s.split(/\n|;|·|•|\u2022/).map(x => x.trim()).filter(Boolean);
  if (parts.length < 3) parts = s.split(/,/).map(x => x.trim()).filter(Boolean);
  return parts;
}
function diagCount(s) { return splitDiag(s).length; }

/* ============================================================
   CORRECCIÓN
   ============================================================ */
function nameOK(input, r) {
  const n = norm(input);
  if (!n) return false;
  const candidates = [n, n.replace(/^roca\s+/, ''), n.replace(/^muestra\s+/, '')];
  return candidates.some(c => r.alias.some(a => norm(a) === c));
}
function compOK(input, r) {
  const n = norm(input);
  if (!n) return false;
  const items = [...(r.gate || []), ...(r.gateExtra || [])];
  let hits = 0;
  for (const it of items) if (hasAny(n, it.keys)) hits++;
  if (hits < (r.gateMin || 1)) return false;
  for (const must of (r.gateMust || [])) if (!hasAny(n, must)) return false;
  return true;
}
function claseOK(input, r) {
  const n = norm(input);
  const map = {
    ig: ['ignea','igneas','igneo','igneos'],
    sed: ['sedimentaria','sedimentarias','sedimentario','sedimentarios'],
    met: ['metamorfica','metamorficas','metamorfico','metamorficos']
  };
  return (map[r.claseKey] || []).some(x => n === x || tokenMatch(n, x));
}
function checkEstructura(r, input) {
  const n = norm(input);
  if (!n) return false;
  if (r.claseKey === 'met') {
    const grupo = r.check.estructura[0], textura = r.check.estructura[1];
    if (r.estructura.startsWith('Foliada') && /(^|\s)no\s+foliad/.test(n)) return false;
    return hasAny(n, grupo) && hasAny(n, textura);
  }
  return hasAny(n, r.check.estructura[0]);
}
function tipoOK(input, tipo, keys) {
  const n = norm(input), t = norm(tipo);
  // Si el tipo no está indicado, no se exige: solo se evalúa el grado.
  if (/^no indicado/.test(t)) return true;
  return hasAny(n, keys);
}
function gradoOK(input, grado) {
  const n = norm(input), g = norm(grado);
  // Cuando la roca no tiene grado indicado, no se exige escribirlo:
  // basta con acertar el tipo de metamorfismo.
  if (/^no indicado/.test(g)) return true;
  if (/^medio alto/.test(g)) return /(^|\s)medio\s*-?\s*alto(\s|$)/.test(n) || /medioalto/.test(n);
  if (/^medio/.test(g)) return /(^|\s)medio(\s|$)/.test(n) && !/medio\s*-?\s*alto/.test(n);
  if (/^bajo/.test(g)) return /(^|\s)bajo(\s|$)/.test(n);
  if (/^alto/.test(g)) return /(^|\s)alto(\s|$)/.test(n) && !/medio\s*-?\s*alto/.test(n);
  return tokenMatch(n, g);
}
function checkOrigen(r, input) {
  const n = norm(input);
  if (!n) return false;
  if (r.claseKey !== 'met') return hasAny(n, r.check.origen[0]);
  const parts = r.origen.split(' · ');
  const tipo = parts[0] || '';
  const grado = parts[1] || '';
  return tipoOK(n, tipo, r.check.origen[0]) && gradoOK(n, grado);
}
function checkClasificacion(r, input) {
  const n = norm(input);
  if (!n) return false;
  if (r.claseKey === 'sed') {
    if (r.clasificacion === 'Detrítica' && /(^|\s)no\s+detrit/.test(n)) return false;
    if (r.clasificacion === 'Química' && /bioquim/.test(n)) return false;
  }
  return hasAny(n, r.check.clasificacion[0]);
}
function checkAnalogo(r, input) {
  const n = norm(input);
  if (r.claseKey === 'ig') {
    return !n || hasAny(n, ['no aplica','no corresponde','ninguno','ninguna','sin analogo']) || n === 'no';
  }
  if (r.claseKey === 'sed') return listOK(n, r.check.analogo, 0);
  return listOK(n, r.check.analogo, 0.5);
}
function autoCheck(key, r, input) {
  switch (key) {
    case 'name': return nameOK(input, r);
    case 'comp': return compOK(input, r);
    case 'clase': return claseOK(input, r);
    case 'estructura': return checkEstructura(r, input);
    case 'origen': return checkOrigen(r, input);
    case 'clasificacion': return checkClasificacion(r, input);
    case 'analogo': return checkAnalogo(r, input);
  }
  return null;
}
function rockScore(res) {
  if (!res.gate) return 0;
  return FIELDS.filter(([k]) => res.v[k] === true).length / FIELDS.length;
}

  cfg.mix = {ig:cuts[0], sed:cuts[1]-cuts[0], met:10-cuts[1]};
  for (const k of ['ig','sed','met']) {

    if (el) el.value = cfg.mix[k];

function vTest() {

function pickRocks(src) {
  if (src === 'missed') {
    const ids = store.get('tf_missed', []);
    return shuffle(ids.map(id => BY[id]).filter(Boolean)).slice(0, 10);
  }
  if (cfg.mode === 'mix') {
    const pick = k => shuffle(ROCKS.filter(r => r.claseKey === k)).slice(0, cfg.mix[k]);
    return shuffle([...pick('ig'), ...pick('sed'), ...pick('met')]);
  }
  return shuffle(ROCKS.filter(r => r.claseKey === cfg.mode)).slice(0, 10);
}
function startTest(src) {

  window.scrollTo({top:0, behavior:'smooth'});
}

function correctRow(r) {

function checkGate() {
  const i = T.i, r = T.rocks[i], res = T.res[i];
  const nameOk = nameOK(res.ans.name || '', r);
  const compOk = compOK(res.ans.comp || '', r);
  res.c1 = true;
  res.gate = nameOk && compOk;
  res.v.name = nameOk;
  res.v.comp = compOk;
  testRock();
}
function checkTable() {
  const i = T.i, r = T.rocks[i], res = T.res[i];
  if (diagCount(res.ans.diagnostico || '') < 3) {
    const w = $('#diag-warn');
    if (w) { w.className = 'short'; w.textContent = 'escribe al menos 3 rasgos'; }
    return;
  }
  for (const k of AUTO_FIELDS) res.v[k] = autoCheck(k, r, res.ans[k] || '');
  res.v.diagnostico = null;
  res.c2 = true;
  testRock();
}

function testSummary() {
  const scores = T.res.map(rockScore);
  const pct = Math.round(scores.reduce((a,b) => a+b, 0) / scores.length * 100);
  const gates = T.res.filter(x => x.gate).length;
  const points = T.res.reduce((a,res) => a + (res.gate ? FIELDS.filter(([k]) => res.v[k] === true).length : 0), 0);
  const max = T.rocks.length * FIELDS.length;
  const missed = T.rocks.filter((r,i) => !T.res[i].gate || rockScore(T.res[i]) < 0.7).map(r => r.id);
  if (!T.saved) {
    T.saved = true;
    const h = store.get('tf_hist', []);
    h.push({
      d: new Date().toLocaleDateString('es-CL', {day:'2-digit', month:'2-digit'}),
      mode: cfg.mode === 'mix'
        ? `Mezcla ${T.mix.ig}+${T.mix.sed}+${T.mix.met}`
        : (MODES.find(([m]) => m === cfg.mode) || ['',''])[1],
      pct, gates, total: T.rocks.length
    });
    store.set('tf_hist', h.slice(-20));
    store.set('tf_missed', [...new Set(missed)]);
  }
  $('#main').innerHTML = `
  <div class="stack narrow">
    <div class="panel stack">
      <div class="kicker">Resultado del test final</div>
      <div style="font:700 54px/1 var(--f-head)">${pct}%</div>
      <p style="margin:0">Puertas superadas: <b>${gates} de ${T.rocks.length}</b>. Puntaje: <b>${points}/${max}</b>. Las filas con puerta fallada cuentan 0.</p>
      <div class="row">
        <button class="btn" data-act="start" data-src="all">Nuevo test</button>
        ${missed.length ? `<button class="btn ghost" data-act="start" data-src="missed">Repasar falladas (${missed.length})</button>` : ''}
        <button class="btn ghost" data-act="reset">Cambiar modo</button>
      </div>
    </div>

    <div class="panel">
      <h3>Detalle por muestra</h3>
      <div class="tbl-wrap" style="max-height:none">
        <table class="tbl-small">
          <tr><th>#</th><th>Roca</th><th>Puerta</th><th>Puntaje</th></tr>
          ${T.rocks.map((r,i) => {
            const res = T.res[i], sc = Math.round(rockScore(res)*100);
            return `<tr>
              <td>${i+1}</td>
              <td><a href="#" data-act="ficha" data-id="${r.id}" style="color:var(--accent)">${esc(r.nombre)}</a></td>
              <td>${res.gate ? '✓' : '✗'}</td>
              <td>${sc}%</td>
            </tr>`;
          }).join('')}
        </table>
      </div>
    </div>
  </div>`;
}

  const csv = [headers, ...rows].map(row => row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');

document.addEventListener('click', e => {

  if (!b) return;
  const a = b.dataset.act;
  if (a === 'tab') { go(b.dataset.v); return; }
  if (a === 'theme') {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set('tf_theme', next);
    return;
  }
  if (a === 'mode') { cfg.mode = b.dataset.m; testSetup(); return; }
  if (a === 'mix-random') { randomMix(); return; }
  if (a === 'start') { startTest(b.dataset.src); return; }
  if (a === 'check1') { checkGate(); return; }
  if (a === 'check2') { checkTable(); return; }
  if (a === 'next') {
    T.i++;
    vTest();
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  if (a === 'mark') {
    const y = window.scrollY;
    T.res[T.i].v[b.dataset.k] = b.dataset.v === '1';
    testRock();
    window.scrollTo(0, y);
    return;
  }
  if (a === 'ficha') {
    e.preventDefault();
    openFicha(b.dataset.id);
    return;
  }
  if (a === 'ficha-img') {
    const main = $('#ficha-main');
    if (main) main.src = b.dataset.src;
    $$('.thumbs button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    return;
  }
  if (a === 'zoom') { openZoom(b.dataset.src); return; }
  if (a === 'close') { closeOverlay(); return; }
  if (a === 'study-filter') { study.filter = b.dataset.f; vEstudiar(); return; }
  if (a === 'study-hide') { study.hide = !study.hide; vEstudiar(); return; }
  if (a === 'table-filter') { table.filter = b.dataset.f; vTabla(); return; }
  if (a === 'csv') { downloadCSV(); return; }
  if (a === 'reset') { T = null; testSetup(); return; }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'study-q') { study.q = el.value; renderStudyGrid(); return; }
  if (el.id === 'table-q') { table.q = el.value; renderTableRows(); return; }
  const mk = el.dataset.mix;
  if (mk) {
    const n = Math.max(0, Math.min(10, parseInt(el.value, 10) || 0));
    cfg.mix[mk] = n;
    if (el.value !== '' && n !== Number(el.value)) el.value = n;
    updateMixUI();
    return;
  }
  const k = el.dataset.k;
  if (!k || !T) return;
  const res = T.res[T.i];
  res.ans[k] = el.value;
  if (k === 'diagnostico') {
    const n = diagCount(el.value);
    const count = $('#diag-count'), warn = $('#diag-warn');
    if (count) count.textContent = `${n}/3 rasgos`;
    if (warn) {
      warn.className = n >= 3 ? 'ok' : 'short';
      warn.textContent = n >= 3 ? 'mínimo cumplido' : 'faltan rasgos';
    }
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  const k = el.dataset.k;
  if (!k || !T) return;
  T.res[T.i].ans[k] = el.value;
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#ov').hidden) closeOverlay();
});

/* ============================================================
   INICIO
   ============================================================ */
$('#foot-count').textContent = ` ${ROCKS.length} rocas en total: ${ROCKS.filter(r=>r.claseKey==='ig').length} ígneas, ${ROCKS.filter(r=>r.claseKey==='sed').length} sedimentarias y ${ROCKS.filter(r=>r.claseKey==='met').length} metamórficas.`;
renderTabs();
vTest();
</script>
